<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-D Kelvin–Helmholtz roll-up</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#f5eee7;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  #label{position:fixed;left:38px;top:28px;letter-spacing:.015em;pointer-events:none;text-shadow:0 2px 14px #000}
  #label b{font-size:30px;font-weight:650} #label span{display:block;margin-top:5px;color:#c6d2d7;font-size:14px}
  #time{position:fixed;right:38px;top:31px;font-size:21px;font-variant-numeric:tabular-nums;color:#ffd48f;text-shadow:0 2px 14px #000}
  #hint{position:fixed;right:26px;bottom:20px;color:#78909c;font-size:11px;opacity:.65}
</style>
</head>
<body>
<canvas id="gl"></canvas><div id="label"><b>Kelvin–Helmholtz roll-up</b><span>vorticity volume · ion-layer response</span></div><div id="time"></div><div id="hint">drag to orbit · scroll to zoom</div>
<script>
const qs=new URLSearchParams(location.search), stem=qs.get('frame')||'../output/figure3-khi-3d-production/frame_00002';
const canvas=document.querySelector('#gl'), gl=canvas.getContext('webgl2',{alpha:false,antialias:true,preserveDrawingBuffer:true});
if(!gl) throw new Error('WebGL2 is required');
const vs=`#version 300 es
in vec2 p; out vec2 uv; void main(){uv=.5*(p+1.);gl_Position=vec4(p,0,1);}`;
const fs=`#version 300 es
precision highp float; precision highp sampler3D;
in vec2 uv; out vec4 outColor; uniform sampler3D vortexVol; uniform sampler3D auxVol; uniform vec2 res; uniform vec3 ro; uniform mat3 cam; uniform vec3 boxSize;
vec2 hitBox(vec3 o,vec3 d){vec3 a=(-.5*boxSize-o)/d,b=(.5*boxSize-o)/d;vec3 lo=min(a,b),hi=max(a,b);return vec2(max(max(lo.x,lo.y),lo.z),min(min(hi.x,hi.y),hi.z));}
vec4 sampleV(vec3 p){return texture(vortexVol,p/boxSize+.5);} vec4 sampleA(vec3 p){return texture(auxVol,p/boxSize+.5);}
vec3 hsv(vec3 c){vec3 p=abs(fract(c.xxx+vec3(0.,.666667,.333333))*6.-3.);return c.z*mix(vec3(1),clamp(p-1.,0.,1.),c.y);}
vec3 palette(float s){
  vec3 ink=vec3(.025,.038,.050), blue=vec3(.025,.22,.95), cyan=vec3(.05,.90,1.0), gold=vec3(1.,.72,.16), red=vec3(1.,.12,.035);
  float a=abs(s); vec3 c=s<0.?mix(cyan,blue,smoothstep(.25,1.,a)):mix(gold,red,smoothstep(.25,1.,a));
  return mix(ink,c,smoothstep(.06,.75,a));
}
void main(){
  vec2 q=(2.*gl_FragCoord.xy-res)/res.y; vec3 rd=normalize(cam*vec3(q,-1.75)); vec2 h=hitBox(ro,rd);
  if(h.x>h.y||h.y<0.){outColor=vec4(.012,.018,.026,1);return;} float t=max(h.x,0.); float dt=(h.y-t)/220.;
  vec3 acc=vec3(0); float A=0.;
  for(int i=0;i<220;i++){
    if(t>h.y||A>.985)break; vec3 pos=ro+rd*t; vec4 v=sampleV(pos), x=sampleA(pos); float s=2.*v.r-1.; float ion=abs(2.*x.r-1.); float wm=abs(2.*x.g-1.); float mag=v.a;
    float av=.045*smoothstep(.72,.97,mag); float ai=.004*smoothstep(.48,.90,ion);
    vec3 e=vec3(.006,0,0); float gx=sampleV(pos+e).a-sampleV(pos-e).a; e=vec3(0,.006,0);float gy=sampleV(pos+e).a-sampleV(pos-e).a;e=vec3(0,0,.006);float gz=sampleV(pos+e).a-sampleV(pos-e).a;
    vec3 n=normalize(vec3(gx,gy,gz)+1e-5), light=normalize(vec3(-.4,.7,.6)); float lit=.35+.75*abs(dot(n,light));
    float materialHue=fract(.58*v.g+.42*v.b+.08*s); vec3 mapColor=hsv(vec3(materialHue,.78,.98));
    vec3 cv=mix(palette(s),mapColor,.55)*lit; vec3 ci=mix(vec3(.40,.06,.025),vec3(1.,.84,.52),smoothstep(.08,.65,ion))*(.5+.6*lit);
    float aa=1.-(1.-av)*(1.-ai); vec3 c=(cv*av+ci*ai)/max(aa,1e-5); acc+=(1.-A)*aa*c; A+=(1.-A)*aa; t+=dt;
  }
  vec3 bg=vec3(.012,.018,.026); acc+=bg*(1.-A); float vign=smoothstep(1.35,.25,length(q)); acc*=.72+.28*vign; outColor=vec4(pow(acc,vec3(.82)),1);
}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw gl.getProgramInfoLog(prog);gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
let yaw=-.82,pitch=.43,zoom=1.25,drag=false,last=[0,0],meta;
function basis(){let target=[0,0,0],cp=Math.cos(pitch),sp=Math.sin(pitch),cy=Math.cos(yaw),sy=Math.sin(yaw);let ro=[zoom*cp*sy,zoom*sp,zoom*cp*cy];let f=norm(ro.map(x=>-x)),r=norm(cross(f,[0,1,0])),u=cross(r,f);return {ro,m:new Float32Array([r[0],r[1],r[2],u[0],u[1],u[2],-f[0],-f[1],-f[2]])}}
function norm(a){let l=Math.hypot(...a);return a.map(x=>x/l)} function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function resize(){let d=Math.min(devicePixelRatio,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height)}
function draw(){resize();let b=basis();gl.uniform2f(gl.getUniformLocation(prog,'res'),canvas.width,canvas.height);gl.uniform3fv(gl.getUniformLocation(prog,'ro'),b.ro);gl.uniformMatrix3fv(gl.getUniformLocation(prog,'cam'),false,b.m);let d=meta.domain_km,scale=1/d[0];gl.uniform3f(gl.getUniformLocation(prog,'boxSize'),1,d[1]*scale,d[2]*scale*4.0);gl.drawArrays(gl.TRIANGLES,0,3)}
canvas.onpointerdown=e=>{drag=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=false;canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-last[0])*.006;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-last[1])*.006));last=[e.clientX,e.clientY];draw()};canvas.onwheel=e=>{zoom=Math.max(1.25,Math.min(4,zoom*Math.exp(e.deltaY*.001)));draw()};onresize=draw;
function upload(unit,uniformName,raw,m){gl.activeTexture(gl.TEXTURE0+unit);let tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_3D,tex);gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_R,gl.CLAMP_TO_EDGE);gl.texImage3D(gl.TEXTURE_3D,0,gl.RGBA8,m.dims[0],m.dims[1],m.dims[2],0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(raw));gl.uniform1i(gl.getUniformLocation(prog,uniformName),unit)}
const base=stem.slice(0,stem.lastIndexOf('/')+1);
fetch(stem+'.json').then(r=>r.json()).then(m=>Promise.all([m,fetch(base+m.vortex_texture).then(r=>r.arrayBuffer()),fetch(base+m.aux_texture).then(r=>r.arrayBuffer())])).then(([m,vraw,araw])=>{meta=m;document.querySelector('#time').textContent=(m.time_s/60).toFixed(1)+' min';upload(0,'vortexVol',vraw,m);upload(1,'auxVol',araw,m);draw();document.title='ready'});
</script>
</body></html>
