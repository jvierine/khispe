<!doctype html><html><head><meta charset="utf-8"><title>KHI vortex map</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060a;color:#eef5f7;font-family:Inter,system-ui,sans-serif}canvas{width:100%;height:100%;display:block}.title{position:fixed;left:38px;top:28px;text-shadow:0 2px 16px #000}.title b{font-size:30px}.title span{display:block;color:#9eb2bd;margin-top:5px;font-size:14px}.time{position:fixed;right:38px;top:30px;color:#ffd177;font-size:22px}.hint{position:fixed;right:25px;bottom:18px;color:#71828a;font-size:11px}
</style></head><body><canvas id="c"></canvas><div class="title"><b>Kelvin–Helmholtz vortex map</b><span>perturbation-vorticity parcels · Clebsch pseudocolor</span></div><div class="time"></div><div class="hint">drag to orbit · scroll to zoom</div><script>
const q=new URLSearchParams(location.search),stem=q.get('frame')||'../output/figure3-khi-3d-production/frame_00003',c=document.querySelector('#c'),gl=c.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
const VS=`#version 300 es
precision highp float; in vec3 pos;in vec4 dat;uniform mat4 mvp;out vec4 d;void main(){vec4 p=mvp*vec4(pos,1);gl_Position=p;gl_PointSize=clamp((1.2+2.8*dat.w)/max(.55,p.w*.5),1.3,6.);d=dat;}`;
const FS=`#version 300 es
precision highp float;in vec4 d;out vec4 o;vec3 hsv(vec3 c){vec3 p=abs(fract(c.xxx+vec3(0.,.666667,.333333))*6.-3.);return c.z*mix(vec3(1),clamp(p-1.,0.,1.),c.y);}void main(){vec2 p=2.*gl_PointCoord-1.;float r=dot(p,p);if(r>1.)discard;float edge=smoothstep(1.,.08,r);float h=fract(.57+.25*d.y+.20*d.z+.10*d.x);vec3 col=hsv(vec3(h,.70,.55+.32*min(d.w,1.)));col+=.10*vec3(max(d.x,0.),.08,max(-d.x,0.));o=vec4(col,edge*(.28+.40*min(d.w,1.)));}`;
function sh(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
let yaw=-.85,pitch=.38,dist=1.15,drag=false,last=[0,0],count=0;
function mul(a,b){let o=new Float32Array(16);for(let r=0;r<4;r++)for(let k=0;k<4;k++)for(let j=0;j<4;j++)o[j*4+r]+=a[k*4+r]*b[j*4+k];return o}function sub(a,b){return a.map((x,i)=>x-b[i])}function norm(a){let l=Math.hypot(...a);return a.map(x=>x/l)}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function matrices(){let eye=[dist*Math.cos(pitch)*Math.sin(yaw),dist*Math.sin(pitch),dist*Math.cos(pitch)*Math.cos(yaw)],f=norm(eye.map(x=>-x)),s=norm(cross(f,[0,1,0])),u=cross(s,f),v=new Float32Array([s[0],u[0],-f[0],0,s[1],u[1],-f[1],0,s[2],u[2],-f[2],0,-s.reduce((a,x,i)=>a+x*eye[i],0),-u.reduce((a,x,i)=>a+x*eye[i],0),f.reduce((a,x,i)=>a+x*eye[i],0),1]);let asp=c.width/c.height,n=.05,fa=10,t=Math.tan(.5);let p=new Float32Array([1/(asp*t),0,0,0,0,1/t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0]);return mul(p,v)}
function draw(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;gl.viewport(0,0,c.width,c.height);gl.clearColor(.003,.008,.014,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniformMatrix4fv(gl.getUniformLocation(pr,'mvp'),false,matrices());gl.drawArrays(gl.POINTS,0,count)}
c.onpointerdown=e=>{drag=true;last=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointerup=()=>drag=false;c.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-last[0])*.006;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-last[1])*.006));last=[e.clientX,e.clientY];draw()};c.onwheel=e=>{dist=Math.max(.75,Math.min(4,dist*Math.exp(e.deltaY*.001)));draw()};onresize=draw;
const base=stem.slice(0,stem.lastIndexOf('/')+1);
fetch(stem+'.particles.json').then(r=>r.json()).then(m=>Promise.all([m,fetch(base+m.particles).then(r=>{if(!r.ok)throw Error(r.status);return r.arrayBuffer()})])).then(([m,raw])=>{let a=new Float32Array(raw),b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);let stride=28;for(let [name,n,off] of [['pos',3,0],['dat',4,12]]){let l=gl.getAttribLocation(pr,name);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,n,gl.FLOAT,false,stride,off)}count=m.count;document.querySelector('.time').textContent=(m.time_s/60).toFixed(1)+' min';gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);draw();document.title='ready'});
</script></body></html>
